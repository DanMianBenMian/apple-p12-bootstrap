name: gsa-probe3
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      APPLE_ID: mocswpkddhxa@aniimate.net
    steps:
      - name: Set up python deps
        run: |
          set -eu
          python3 -m venv /tmp/gv
          /tmp/gv/bin/pip install -q --upgrade pip
          /tmp/gv/bin/pip install -q requests urllib3 cryptography srp pyobjc-framework-Cocoa
          /tmp/gv/bin/python -c "import srp._pysrp, requests, cryptography, objc; print('deps ok')"

      - name: Fetch probe via API (no CDN lag)
        run: |
          set -eu
          curl -sL "https://api.github.com/repos/DanMianBenMian/apple-p12-bootstrap/contents/gsa_probe3.py" -o /tmp/gsa.json
          /tmp/gv/bin/python -c "import json,base64;open('/tmp/gsa_probe3.py','w').write(base64.b64decode(json.load(open('/tmp/gsa.json'))['content']).decode())"
          wc -l /tmp/gsa_probe3.py
          /tmp/gv/bin/python -m py_compile /tmp/gsa_probe3.py && echo "PY SYNTAX OK"

      - name: Run probe
        run: |
          set +e
          /tmp/gv/bin/python /tmp/gsa_probe3.py 2>&1 | tee "$RUNNER_TEMP/probe.log"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe3-output
          path: ${{ runner.temp }}/*.log
          if-no-files-found: warn
