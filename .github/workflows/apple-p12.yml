name: apple-free-p12
on:
  workflow_dispatch:
    inputs:
      tfa_code:
        description: 'Optional fallback 2FA code (runner polls 2fa_code.txt for a FRESH one)'
        required: false
        default: ''

jobs:
  make-cert:
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      APPLE_ID: mocswpkddhxa@aniimate.net
      # Apple retired GET /olympus/v1/app/config (now 404), so spaceship can no
      # longer discover X-Apple-Widget-Key on its own. This is the long-standing
      # public fallback key that idmsa.apple.com still accepts.
      APPLE_WIDGET_KEY: e0b80c3bf78523bfe80974d320935bfa30add02e1bff88ec2166c6bd5a706c42
      CODE_POLL_URL: https://raw.githubusercontent.com/DanMianBenMian/apple-p12-bootstrap/main/2fa_code.txt
    steps:
      - name: Seed widget key + write 2FA poller patch
        run: |
          set -eu
          # spaceship reads this file BEFORE hitting Apple (client.rb:723-724)
          echo -n "$APPLE_WIDGET_KEY" > /tmp/spaceship_itc_service_key.txt
          echo "widget key bytes: $(wc -c < /tmp/spaceship_itc_service_key.txt)"

          cat > /tmp/twostep_patch.rb <<'RUBY'
          module TwoStepPoll
            def ask_for_2fa_code(msg)
              url  = ENV['CODE_POLL_URL']
              seed = ENV['TFA_CODE_SEED'].to_s.strip
              n = (self.instance_variable_get(:@poll_depth) || 0)
              self.instance_variable_set(:@poll_depth, n + 1)
              puts(">> 2FA poll attempt ##{n + 1}; waiting for a FRESH code via #{url}")

              require 'net/http'
              require 'uri'
              deadline = Time.now + 420
              last = nil
              until Time.now > deadline
                begin
                  uri = URI(url + (url.include?('?') ? '&' : '?') + 't=' + Time.now.to_i)
                  res = Net::HTTP.start(uri.host, uri.port, use_ssl: true,
                                        open_timeout: 10, read_timeout: 10) do |h|
                    h.get(uri.request_uri, 'Cache-Control' => 'no-cache')
                  end
                  val = res.body.to_s.strip
                  if val =~ /\A[0-9]{6}\z/ && val != last
                    last = val
                    puts(">> got code #{val}, submitting")
                    return val
                  end
                rescue => e
                  puts(">> poll error: #{e.class}: #{e.to_s[0,120]}")
                end
                sleep 5
              end
              puts(">> TIMED OUT waiting for a 2FA code")
              return seed.empty? ? '000000' : seed
            end
          end
          RUBY
          echo "patch written"
          ruby -c /tmp/twostep_patch.rb

      - name: Login + create development certificate
        env:
          FASTLANE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          FASTLANE_DONT_STORE_PASSWORD: '1'
          FASTLANE_OPT_OUT_USAGE: '1'
          FASTLANE_IS_INTERACTIVE: 'true'
          TFA_CODE_SEED: ${{ inputs.tfa_code }}
        run: |
          set +e
          WORK=$(mktemp -d); cd "$WORK"
          cat > runner.rb <<'RUBY'
          require 'spaceship'
          load '/tmp/twostep_patch.rb'
          Spaceship::Client.prepend(TwoStepPoll)
          Spaceship::Client.class_eval do
            def itc_service_key
              @service_key ||= ENV['APPLE_WIDGET_KEY']
            end
          end
          $stdout.sync = true
          puts(">> patches applied")

          user = ENV['APPLE_ID']
          pass = ENV['FASTLANE_PASSWORD']

          begin
            puts(">> portal login as #{user}")
            Spaceship::PortalClient.login(user, pass)
            puts(">> PORTAL LOGIN OK")
            teams = Spaceship::PortalClient.teams
            puts(">> TEAMS: " + teams.map { |t| [t['name'], t['role'], t['teamId']].inspect }.join(' | '))
            certs = Spaceship::PortalClient.certificate_list
            puts(">> CERTIFICATES: #{certs.size}")
            certs.each { |c| puts("   #{c['name']} | #{c['certificate_id']}") }
            puts(">> RUN_LIST: " + Spaceship::PortalClient.runners.map { |r| r['name'] }.inspect)
          rescue => e
            puts(">> PORTAL ERROR #{e.class}: #{e.to_s[0,600]}")
            puts(e.backtrace.first(15).join("\n"))
          end
          RUBY
          printf '%s\n' "$FASTLANE_PASSWORD" | ruby runner.rb 2>&1 | tee cert.log
          cp cert.log "$RUNNER_TEMP/" 2>/dev/null || true

      - name: Create certificate via fastlane cert
        env:
          FASTLANE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          FASTLANE_DONT_STORE_PASSWORD: '1'
          FASTLANE_OPT_OUT_USAGE: '1'
          FASTLANE_IS_INTERACTIVE: 'true'
          TFA_CODE_SEED: ${{ inputs.tfa_code }}
          RUBYOPT: '-r/tmp/twostep_patch.rb'
        run: |
          set +e
          WORK=$(mktemp -d); cd "$WORK"
          cat > patch2.rb <<'RUBY'
          require 'spaceship'
          load '/tmp/twostep_patch.rb'
          Spaceship::Client.prepend(TwoStepPoll)
          Spaceship::Client.class_eval do
            def itc_service_key
              @service_key ||= ENV['APPLE_WIDGET_KEY']
            end
          end
          R
          # keep .p12 out of keychain prompts
          printf '%s\n' "$FASTLANE_PASSWORD" | \
            ruby -r./patch2.rb -S fastlane cert -u "$APPLE_ID" --verbose 2>&1 | tee cert2.log
          echo "=== files ==="
          ls -la
          for c in *.cer *.p12; do
            [ -f "$c" ] && echo "--- $c ---" && openssl x509 -in "$c" -noout -subject -dates -serial 2>/dev/null
          done
          cp cert2.log "$RUNNER_TEMP/" 2>/dev/null || true

      - name: Summary
        if: always()
        run: |
          echo "=== PORTAL PHASE ==="
          grep -inE '2FA poll|got code|PORTAL LOGIN|TEAMS|CERTIFICATES|PORTAL ERROR|TIMED OUT|Incorrect|Unauthorized' "$RUNNER_TEMP/cert.log" 2>/dev/null | head -40
          echo "=== CERT PHASE ==="
          grep -inE '2FA poll|got code|successfully|created|TIMED OUT|Incorrect|Unauthorized|certificate' "$RUNNER_TEMP/cert2.log" 2>/dev/null | head -40

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-cert-output
          path: |
            ${{ runner.temp }}/*.log
            *.cer
            *.p12
          if-no-files-found: warn
