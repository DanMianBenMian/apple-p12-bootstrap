name: apple-free-p12
on:
  workflow_dispatch:
    inputs:
      tfa_code:
        description: 'Optional fallback 2FA code (runner polls 2fa_code.txt for a FRESH one)'
        required: false
        default: ''

jobs:
  make-cert:
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      APPLE_ID: mocswpkddhxa@aniimate.net
      # Apple retired GET /olympus/v1/app/config (now 404), so spaceship can no
      # longer discover X-Apple-Widget-Key on its own. This is the long-standing
      # public fallback key that idmsa.apple.com still accepts.
      APPLE_WIDGET_KEY: e0b80c3bf78523bfe80974d320935bfa30add02e1bff88ec2166c6bd5a706c42
      CODE_POLL_URL: https://raw.githubusercontent.com/DanMianBenMian/apple-p12-bootstrap/main/2fa_code.txt
    steps:
      - name: Seed widget key + install 2FA poller
        run: |
          set -eu
          # spaceship reads this file BEFORE hitting Apple (client.rb:723-724)
          echo -n "$APPLE_WIDGET_KEY" > /tmp/spaceship_itc_service_key.txt
          echo "widget key bytes: $(wc -c < /tmp/spaceship_itc_service_key.txt)"

          cat > /tmp/poll_2fa.py <<'PYEOF'
          import os, re, sys, time, urllib.request
          URL = os.environ.get("CODE_POLL_URL", "")
          SEED = (os.environ.get("TFA_CODE_SEED") or "").strip()
          WAIT = int(os.environ.get("CODE_WAIT_SECONDS", "420"))
          def fetch():
              sep = "&" if "?" in URL else "?"
              u = URL + sep + "t=" + str(int(time.time()))
              req = urllib.request.Request(u, headers={"Cache-Control": "no-cache", "User-Agent": "curl/8"})
              r = urllib.request.urlopen(req, timeout=15)
              body = r.read().decode("utf-8", "replace").strip()
              print(">> poll http=%s body=%r" % (r.status, body[:40]), flush=True)
              return body
          def main():
              print(">> waiting up to %ds for a FRESH 6-digit code" % WAIT, flush=True)
              deadline = time.time() + WAIT
              last = None
              while time.time() < deadline:
                  try:
                      v = fetch()
                      if re.fullmatch(r"[0-9]{6}", v) and v != last:
                          last = v
                          print(">> GOT CODE %s" % v, flush=True)
                          print(v, flush=True)
                          return 0
                  except Exception as e:
                      print(">> poll error: %s: %s" % (type(e).__name__, str(e)[:160]), flush=True)
                  time.sleep(5)
              print(">> TIMED OUT waiting for a 2FA code; falling back to seed", flush=True)
              print(SEED if SEED else "000000", flush=True)
              return 0
          if __name__ == "__main__":
              sys.exit(main())
          PYEOF
          python3 -c "import py_compile; py_compile.compile('/tmp/poll_2fa.py', doraise=True); print('PY SYNTAX OK')"
          head -3 /tmp/poll_2fa.py
          echo "installer ok"

      - name: Login + create development certificate
        timeout-minutes: 15
        env:
          FASTLANE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          FASTLANE_DONT_STORE_PASSWORD: '1'
          FASTLANE_OPT_OUT_USAGE: '1'
          FASTLANE_IS_INTERACTIVE: 'true'
          TFA_CODE_SEED: ${{ inputs.tfa_code }}
        run: |
          set +e
          WORK=$(mktemp -d); cd "$WORK"
          cat > runner.rb <<'RUBY'
          require 'spaceship'
          require 'timeout'

          module TwoStepPoll
            def ask_for_2fa_code(msg)
              n = (self.instance_variable_get(:@poll_depth) || 0)
              self.instance_variable_set(:@poll_depth, n + 1)
              puts(">> 2FA needed (attempt #{n + 1}); shelling out to python poller")
              out = IO.popen({'CODE_WAIT_SECONDS' => '420'}, ['python3', '/tmp/poll_2fa.py'], &:read)
              code = out.to_s.lines.last.to_s.strip
              puts(">> poller returned #{code.inspect}")
              code =~ /\A[0-9]{6}\z/ ? code : '000000'
            end
          end

          Spaceship::Client.prepend(TwoStepPoll)
          Spaceship::Client.class_eval do
            def itc_service_key
              @service_key ||= ENV['APPLE_WIDGET_KEY']
            end
          end
          $stdout.sync = true
          puts(">> patches applied")

          user = ENV['APPLE_ID']
          pass = ENV['FASTLANE_PASSWORD']

          logged_in = false
          begin
            puts(">> portal login as #{user}")
            Spaceship::PortalClient.login(user, pass)
            logged_in = true
            puts(">> PORTAL LOGIN OK")
          rescue => e
            puts(">> PORTAL LOGIN ERROR #{e.class}: #{e.to_s[0,600]}")
            puts(e.backtrace.first(12).join("\n"))
          end

          if logged_in
            require 'net/http'
            require 'uri'
            cookie = Spaceship::PortalClient.instance_variable_get(:@cookie).to_s
            jar = Spaceship::Client.instance_variable_get(:@cookie)
            # The developer portal needs its own session (myacinfo / acn01).
            # Visiting the account page after login completes that handshake.
            ['https://developer.apple.com/account/',
             'https://developer.apple.com/services-account/QH65B2/account/getTeams'].each do |u|
              begin
                uri = URI(u)
                res = Net::HTTP.start(uri.host, uri.port, { use_ssl: true, open_timeout: 15, read_timeout: 30 }) do |h|
                  req = Net::HTTP::Get.new(uri.request_uri)
                  req['Cookie'] = jar.map { |c| "#{c.name}=#{c.value}" }.join('; ')
                  req['User-Agent'] = 'Mozilla/5.0'
                  req['X-Requested-With'] = 'XMLHttpRequest'
                  req['X-Apple-Widget-Key'] = ENV['APPLE_WIDGET_KEY'].to_s
                  h.request(req)
                end
                puts(">> VISIT #{u} -> #{res.code} (#{res.body.to_s.length}B)")
                if res.code == '302' || res.code == '301'
                  puts(">>   redirect: #{res['Location']}")
                end
                if u.include?('getTeams')
                  puts(">> TEAMS RAW: #{res.body.to_s[0, 1500]}")
                end
              rescue => e
                puts(">> VISIT #{u} ERROR #{e.class}: #{e.to_s[0,200]}")
              end
            end
            # dump which cookies we actually hold
            puts(">> COOKIES: " + jar.map { |c| c.name }.join(','))
            [
              "/services-account/QH65B2/listTeams.action",
              "/services-account/QH65B2/listCertificates.action",
            ].each do |path|
              begin
                uri = URI("https://developer.apple.com#{path}")
                res = Net::HTTP.start(uri.host, uri.port, { use_ssl: true, open_timeout: 15, read_timeout: 30 }) do |h|
                  req = Net::HTTP::Get.new(uri.request_uri)
                  req['Cookie'] = jar.map { |c| "#{c.name}=#{c.value}" }.join('; ')
                  req['X-Requested-With'] = 'XMLHttpRequest'
                  req['X-Apple-Widget-Key'] = ENV['APPLE_WIDGET_KEY'].to_s
                  req['User-Agent'] = 'Mozilla/5.0'
                  h.request(req)
                end
                puts(">> EP #{path} [#{res.code}]: #{res.body.to_s[0, 1500]}")
              rescue => e
                puts(">> EP #{path} ERROR #{e.class}: #{e.to_s[0,200]}")
              end
            end
          end
          puts(">> DONE logged_in=#{logged_in}")
          RUBY
          ruby -c runner.rb && echo "RUBY SYNTAX OK"
          printf '%s\n' "$FASTLANE_PASSWORD" | ruby runner.rb 2>&1 | tee cert.log
          cp cert.log "$RUNNER_TEMP/" 2>/dev/null || true

      - name: Xcode path - does it see a Personal Team?
        if: always()
        timeout-minutes: 10
        run: |
          set +e
          echo "=== xcodebuild version ==="
          xcodebuild -version
          echo "=== security find-identity (keychain) ==="
          security find-identity -v -p codesigning 2>&1 | head -20
          echo "=== existing provisioning profiles ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || echo "(none)"
          echo "=== xcodebuild first-launch state ==="
          xcodebuild -runFirstLaunch 2>&1 | tail -5
          cp /dev/null "$RUNNER_TEMP/xcode.log" 2>/dev/null || true
          {
            echo "xcodebuild: $(xcodebuild -version 2>&1 | tr '\n' ' ')"
            echo "identities:"; security find-identity -v -p codesigning 2>&1 | head -20
          } > "$RUNNER_TEMP/xcode.log" 2>&1

      - name: Create certificate via fastlane cert
        env:
          FASTLANE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          FASTLANE_DONT_STORE_PASSWORD: '1'
          FASTLANE_OPT_OUT_USAGE: '1'
          FASTLANE_IS_INTERACTIVE: 'true'
          TFA_CODE_SEED: ${{ inputs.tfa_code }}
        run: |
          set +e
          WORK=$(mktemp -d); cd "$WORK"
          cat > patch2.rb <<'RUBY'
          require 'spaceship'
          module TwoStepPoll
            def ask_for_2fa_code(msg)
              puts(">> 2FA needed; shelling out to python poller")
              out = IO.popen({'CODE_WAIT_SECONDS' => '420'}, ['python3', '/tmp/poll_2fa.py'], &:read)
              code = out.to_s.lines.last.to_s.strip
              puts(">> poller returned #{code.inspect}")
              code =~ /\A[0-9]{6}\z/ ? code : '000000'
            end
          end
          Spaceship::Client.prepend(TwoStepPoll)
          Spaceship::Client.class_eval do
            def itc_service_key
              @service_key ||= ENV['APPLE_WIDGET_KEY']
            end
          end
          RUBY
          ruby -c patch2.rb && echo "RUBY SYNTAX OK"
          printf '%s\n' "$FASTLANE_PASSWORD" | \
            ruby -r./patch2.rb -S fastlane cert -u "$APPLE_ID" --verbose 2>&1 | tee cert2.log
          echo "=== files ==="
          ls -la
          for c in *.cer *.p12; do
            [ -f "$c" ] && echo "--- $c ---" && openssl x509 -in "$c" -noout -subject -dates -serial 2>/dev/null
          done
          cp cert2.log "$RUNNER_TEMP/" 2>/dev/null || true

      - name: Summary
        if: always()
        run: |
          echo "=== PORTAL PHASE ==="
          grep -inE 'patches applied|portal login|2FA needed|poller returned|GOT CODE|VISIT |TEAMS RAW|COOKIES:|EP /services|DONE logged' "$RUNNER_TEMP/cert.log" 2>/dev/null | head -40
          echo "=== XCODE PHASE ==="
          cat "$RUNNER_TEMP/xcode.log" 2>/dev/null | head -30 || echo "(no xcode.log)"
          echo "=== CERT PHASE ==="
          grep -inE '2FA needed|poller returned|GOT CODE|successfully|created|TIMED OUT|Incorrect|Unauthorized|certificate' "$RUNNER_TEMP/cert2.log" 2>/dev/null | head -40

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-cert-output
          path: |
            ${{ runner.temp }}/*.log
            *.cer
            *.p12
          if-no-files-found: warn
