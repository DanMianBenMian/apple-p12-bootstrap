name: gsa-probe9
on:
  workflow_dispatch:
    inputs:
      gh_pat:
        description: 'PAT so the runner can fetch the script'
        required: false
        default: ''

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      APPLE_ID: mocswpkddhxa@aniimate.net
    steps:
      - name: Ensure Rosetta 2
        run: |
          /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null || \
            softwareupdate --install-rosetta --agree-to-license
          /usr/bin/arch -x86_64 /usr/bin/true && echo "ROSETTA OK"

      - name: x86_64 python deps
        run: |
          set -eu
          /usr/bin/arch -x86_64 /usr/bin/python3 -m pip install -q --upgrade pip || true
          /usr/bin/arch -x86_64 /usr/bin/python3 -m pip install -q --target /tmp/pyx86 \
            requests urllib3 cryptography srp
          /usr/bin/arch -x86_64 /usr/bin/python3 -c \
            "import sys; print('arch under python:', sys.executable, sys.platform)"

      - name: Fetch probe via API
        env:
          GH_PAT: ${{ inputs.gh_pat }}
        run: |
          set -eu
          curl -sL -H "Authorization: Bearer $GH_PAT" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/DanMianBenMian/apple-p12-bootstrap/contents/gsa_probe9.py" -o /tmp/gsa.json
          /usr/bin/arch -x86_64 /usr/bin/python3 -c "import json,base64;open('/tmp/gsa_probe9.py','w').write(base64.b64decode(json.load(open('/tmp/gsa.json'))['content']).decode())"
          wc -l /tmp/gsa_probe9.py
          /usr/bin/arch -x86_64 /usr/bin/python3 -m py_compile /tmp/gsa_probe9.py && echo "PY SYNTAX OK"

      - name: Run probe9 (Rosetta x86_64 CoreADI provisioning + GSA init)
        env:
          PYTHONPATH: /tmp/pyx86
        run: |
          set +e
          /usr/bin/arch -x86_64 /usr/bin/python3 /tmp/gsa_probe9.py 2>&1 | tee "$RUNNER_TEMP/probe9.log"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe9-log
          path: ${{ runner.temp }}/*.log
          if-no-files-found: warn
